[build]
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"

[deploy.environmentVariables]
# Railway private networking: frontend nginx → backend service
# Backend service is named "github-pages" in this Railway project
BACKEND_URL = "http://github-pages.railway.internal:8000"
